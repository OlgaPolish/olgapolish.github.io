:root{
  /* Палитра: светлый тауп + графит) */
  --bg:#fbf9f7; --paper:#efe9e5; --ink:#2b2826; --muted:#8a817b;
  --wine:#4b4542; --espresso:#2e2a28; --brown:#3d3734; --gold:#e6dcd5; --goldd:#9b8a7f; --line:#e6dfda;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:15px/1.7 Montserrat,"Helvetica Neue",Arial,sans-serif}
a{color:inherit;text-decoration:none}
.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500}
.eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-weight:500}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
/* announcement */
.bar{background:var(--espresso);color:#e3dad4;text-align:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:9px 16px}
.bar b{color:var(--gold);font-weight:500}
/* header */
header{position:sticky;top:0;z-index:10;background:rgba(255,253,251,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{display:flex;align-items:center;gap:12px;font-family:"Bodoni Moda",Didot,Georgia,serif;font-weight:400;font-size:30px;line-height:.9;letter-spacing:.04em}
.logo small{display:block;font-family:Montserrat,sans-serif;font-size:8px;letter-spacing:.42em;color:var(--muted);font-weight:500;margin-top:2px;text-transform:uppercase}
.logo .lg{width:46px;height:46px;border-radius:50%;object-fit:cover}
.menu{display:flex;gap:28px;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.menu a{position:relative;padding:4px 0}
.menu a::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1px;background:var(--goldd);transition:.3s}
.menu a:hover::after{right:0}
.right{display:flex;align-items:center;gap:14px}
.lang{display:flex;gap:4px;font-size:11px}
.lang button{border:1px solid var(--line);background:none;padding:5px 9px;cursor:pointer;letter-spacing:.12em;color:var(--muted);font:inherit;font-weight:500}
.lang button.on{background:var(--wine);color:#fbf6f1;border-color:var(--wine)}
.burger{display:none;width:40px;height:40px;border:1px solid var(--line);background:none;cursor:pointer;padding:0;position:relative;color:var(--wine)}
.burger span,.burger span::before,.burger span::after{position:absolute;left:50%;width:18px;height:1.5px;margin-left:-9px;background:currentColor;transition:.25s;content:""}
.burger span{top:50%;margin-top:-.75px}.burger span::before{top:-6px;left:0;margin-left:0}.burger span::after{top:6px;left:0;margin-left:0}
.burger[aria-expanded="true"] span{background:transparent}
.burger[aria-expanded="true"] span::before{top:0;transform:rotate(45deg)}
.burger[aria-expanded="true"] span::after{top:0;transform:rotate(-45deg)}
@media(max-width:900px){
  .burger{display:block}
  .menu{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:#fffdfb;border-bottom:1px solid var(--line);box-shadow:0 18px 30px rgba(0,0,0,.08);padding:6px 24px 14px}
  .menu.open{display:flex}
  .menu a{padding:15px 0;border-bottom:1px solid var(--line);font-size:13px}
  .menu a:last-child{border-bottom:0}
  .menu a::after{display:none}
}
/* hero */
.hero{position:relative;min-height:82vh;display:flex;align-items:center;overflow:hidden;color:#fbf6f1;
  background:radial-gradient(60% 80% at 78% 40%,rgba(155,138,127,.45) 0,rgba(155,138,127,0) 60%),radial-gradient(50% 60% at 15% 90%,rgba(230,220,213,.12) 0,rgba(230,220,213,0) 70%),linear-gradient(160deg,#5a534f,#24211f)}
.hero .grid{position:relative;display:grid;grid-template-columns:1.15fr .85fr;align-items:stretch;min-height:82vh;gap:20px;max-width:1200px;width:100%;margin:0 auto;padding:0 20px}
.hero.nocover .grid{grid-template-columns:1fr}
.hero .in{padding:70px 0;align-self:center}
.hero .eyebrow{color:#c9bcb3}
.hero h1{font-family:"Bodoni Moda",Didot,Georgia,serif;font-weight:400;color:#fff;font-size:clamp(70px,11vw,160px);line-height:.9;letter-spacing:.02em;margin:10px 0 0}
.hero h1 span{display:block;font-family:Montserrat,sans-serif;font-size:13px;letter-spacing:.6em;text-transform:uppercase;color:var(--gold);margin-top:20px;font-weight:500}
.hero p.tag{margin:26px 0 36px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:24px;color:#ece4de;max-width:30ch}
.hero .meta{margin-top:26px;font-size:12px;color:#a39890;letter-spacing:.04em}
/* обложка — арка в фирменном стиле: скругленный верх + тонкая рамка-контур */
.hero .cover{position:absolute;right:7%;top:9%;height:84%;aspect-ratio:3/4;width:auto;max-width:none;object-fit:cover;border-radius:999px 999px 0 0;outline:1px solid rgba(230,220,213,.55);outline-offset:14px;box-shadow:0 40px 80px rgba(0,0,0,.45)}
@media(max-width:900px){.hero .grid{grid-template-columns:1fr;text-align:center}.hero .cover{position:static;height:auto;width:66%;justify-self:center;order:-1;margin-top:46px}.hero .grid{min-height:0}.hero .in{padding:60px 0}.hero p.tag{margin-left:auto;margin-right:auto}}
.btn{display:inline-flex;align-items:center;gap:12px;background:var(--wine);color:#fbf6f1;padding:15px 30px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;border:1px solid var(--wine);border-radius:2px;transition:.25s}
.btn:hover{background:var(--goldd);border-color:var(--goldd)}
.hero .btn{background:var(--goldd);border-color:var(--goldd);color:#fff}
.hero .btn:hover{background:var(--gold);border-color:var(--gold);color:var(--espresso)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
/* летящие лепестки в шапке */
.petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.petal{position:absolute;top:-40px;will-change:transform;animation:pfall linear infinite}
.petal i{display:block;animation:psway ease-in-out infinite alternate}
.petal img{display:block;height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18));animation:pflip linear infinite}
@keyframes pfall{to{transform:translateY(var(--fall,110vh))}}
@keyframes psway{from{transform:translateX(calc(var(--sw,40px)*-1)) rotate(-25deg)}to{transform:translateX(var(--sw,40px)) rotate(35deg)}}
@keyframes pflip{0%{transform:rotate(0) scaleX(1)}50%{transform:rotate(180deg) scaleX(.4)}100%{transform:rotate(360deg) scaleX(1)}}
@media(prefers-reduced-motion:reduce){.petals{display:none}}
/* sections */
section{padding:96px 0}
.head{text-align:center;margin-bottom:50px}
.head h2{font-family:"Bodoni Moda",Didot,Georgia,serif;font-weight:400;color:var(--brown);font-size:clamp(32px,4.4vw,50px);line-height:1.05;margin-top:6px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.tile{position:relative;aspect-ratio:3/4;display:flex;align-items:flex-end;padding:20px;color:#fff;overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(43,40,38,.75))}
.tile span{position:relative;z-index:1;font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:flex-end;width:100%}
.tile i{font-style:normal;transition:.25s;color:var(--gold)}
.tile em{display:block;font-style:normal;font-family:"Cormorant Garamond",serif;font-size:18px;letter-spacing:.02em;text-transform:none;color:var(--gold);margin-top:4px}
.tile{transition:transform .35s}.tile:hover{transform:translateY(-4px)}
.tile:hover span i{transform:translateX(5px)}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.gal>*{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.ph{background:linear-gradient(160deg,#eee8e4,#b9aca3)}
@media(max-width:900px){.gal{grid-template-columns:repeat(2,1fr)}}
/* price */
.price{background:var(--paper)}
#preise{background:var(--espresso);color:#efe4da}
#preise .head h2{color:var(--gold)}
#preise .eyebrow{color:#c9bcb3}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:22px}
.cat{border:1px solid rgba(242,228,214,.18);padding:30px 28px 20px;background:rgba(255,255,255,.03)}
.cat h3{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:28px;color:var(--gold);margin-bottom:2px}
.cat .who{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#a39890;margin-bottom:12px}
.cat .sub{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:18px 0 2px;opacity:.8}
.row{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px dotted rgba(242,228,214,.2);font-size:14px}
.row:last-child{border:0}
.row .n{flex:1}
.row .n small{display:block;font-size:12px;color:#a39890}
.row .p{white-space:nowrap;font-weight:600;color:var(--gold)}
.row .d{white-space:nowrap;font-size:12px;color:#a39890}
.row .ask{white-space:nowrap;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#c9bcb3;border-bottom:1px solid rgba(207,174,152,.45);margin-left:4px}
.row .ask:hover{color:var(--gold);border-color:var(--gold)}
@media(max-width:600px){.row{flex-wrap:wrap;row-gap:2px}.row .n{flex-basis:100%}}
.note{text-align:center;margin-top:30px;color:#a39890;font-size:13px}
.offer:empty{display:none}.offer{max-width:760px;margin:0 auto 40px;text-align:center;border:1px solid rgba(242,228,214,.35);padding:22px 24px}
.offer b{display:block;font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:500;color:#fff;margin:4px 0}
.offer s{color:#a39890}
/* team */
.split{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.portrait{aspect-ratio:4/5;background:linear-gradient(160deg,#eee8e4,#a99a90)}
.split h2{font-family:"Bodoni Moda",Didot,Georgia,serif;font-weight:400;color:var(--brown);font-size:clamp(32px,4vw,48px);line-height:1.05;margin:8px 0 18px}
.split p{color:#4a4440;margin-bottom:22px}
.team{list-style:none;margin:0 0 28px}
.team li{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.team li b{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:500;color:var(--brown)}
.team li span{font-size:12px;letter-spacing:.08em;color:var(--muted);text-align:right}
/* reviews */
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.rev{background:var(--bg);padding:30px;border:1px solid var(--line)}
.stars{color:var(--goldd);letter-spacing:.25em;margin-bottom:12px}
.rev p{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:19px;line-height:1.5;color:var(--brown)}
.rev b{display:block;margin-top:16px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.gscore{text-align:center;margin-top:30px;font-size:13px}
.gscore a{border-bottom:1px solid}
/* faq */
.faq{max-width:780px;margin:0 auto}
details{border-bottom:1px solid var(--line);padding:20px 0}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:500;color:var(--brown)}
summary::after{content:"+";font-family:Montserrat;font-size:20px;color:var(--goldd)}
details[open] summary::after{content:"–"}
details p{margin-top:10px;color:#4a4440}
/* contact */
.contact{background:linear-gradient(180deg,#4b4542,#24211f);color:#efe4da}
.contact .eyebrow{color:#c9bcb3}
.contact .head h2{color:var(--gold)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:34px;margin-top:10px}
.contact h3{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#c9bcb3;margin-bottom:12px;font-weight:600}
.contact .btn{background:var(--goldd);color:#fff;border-color:var(--goldd)}
.contact .btn:hover{background:transparent;color:var(--gold);border-color:var(--gold)}
#c-hours>div{display:flex;justify-content:space-between;max-width:220px}
footer{background:#1c1a19;color:#8f8680;font-size:12px;letter-spacing:.04em;padding:24px 0}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
/* instagram + whatsapp */
.ig{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:50%;transition:.2s}
.ig svg{width:16px;height:16px;fill:currentColor}
.ig:hover{background:var(--wine);color:var(--gold);border-color:var(--wine)}
.igf,.wa{position:fixed;right:18px;z-index:20;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.wa{bottom:18px;background:#25d366}.wa svg{width:30px;height:30px;fill:#fff}
.igf{bottom:86px;background:var(--wine);border:1px solid rgba(242,228,214,.4)}.igf svg{width:26px;height:26px;fill:var(--gold)}
.igl{display:inline-flex;align-items:center;gap:8px;margin-top:16px;border-bottom:1px solid;color:var(--gold)}
.igl svg{width:15px;height:15px;fill:currentColor}
.demo{position:fixed;left:12px;bottom:12px;z-index:20;background:#fff;border:1px solid var(--line);font-size:11px;padding:6px 10px;color:var(--muted)}
/* 3 преимущества */
section.values{background:var(--paper);padding:56px 0}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:34px}
.val{display:flex;gap:18px}
.val .num{font-family:"Cormorant Garamond",serif;font-size:36px;line-height:1;color:var(--goldd)}
.val h3{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:24px;color:var(--brown);margin-bottom:6px}
.val p{color:#4a4440;font-size:14px}
/* блок «Studio» */
section.studio{padding:0 0 96px}
.studio img{width:100%;height:64vh;min-height:380px;object-fit:cover;object-position:center 35%;display:block}
.studio .card{position:relative;margin-top:-140px;max-width:560px;background:var(--wine);color:#efe4da;padding:44px 40px}
.studio .card .eyebrow{color:#c9bcb3}
.studio .card h2{font-family:"Cormorant Garamond",serif;font-weight:500;color:var(--gold);font-size:clamp(30px,3.6vw,40px);line-height:1.15;margin:10px 0 16px}
.studio .card p{font-size:14px;color:#e3dad4}
@media(max-width:600px){.studio .card{margin-top:-60px;padding:30px 24px}}
.wa,.igf,.ig,.igl{display:none!important}
</style>
</head>
<body>

<div class="bar" id="bar"></div>

const grad=["linear-gradient(160deg,#eee8e4,#b9aca3)","linear-gradient(160deg,#e9e2dd,#a69890)","linear-gradient(160deg,#e5ddd7,#8f8179)","linear-gradient(160deg,#ebe4df,#7a6d66)","linear-gradient(160deg,#e7dfd9,#57504c)"];
function render(l){
  const t=T[l]; document.documentElement.lang=l;
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  const wa=`https://wa.me/${SITE.wa}`; const main=SITE.book||wa;
  $('bar').innerHTML=t.bar;
  $('logo').innerHTML=`${SITE.images.logo?`<img src="${SITE.images.logo}" alt="" class="lg" onerror="this.remove()">`:''}<span>${SITE.name}<small>${SITE.sub}</small></span>`;
  $('menu').innerHTML=t.menu.map(([h,x])=>`<a href="${h}">${x}</a>`).join('');
  $('h-eyebrow').textContent=t.hEyebrow; $('h-title').innerHTML=`${t.hTitle}<span>${t.hSub}</span>`;
  $('h-tag').textContent=t.hTag; $('h-btn').textContent=t.btn; $('h-btn').href=main; $('h-meta').textContent=t.meta;
  $('values').innerHTML=t.values.map(([h,p],k)=>`<div class="val"><span class="num">0${k+1}</span><div><h3>${h}</h3><p>${p}</p></div></div>`).join('');
  $('s-eyebrow').textContent=t.sEyebrow; $('s-title').textContent=t.sTitle;
  /* фото поверх градиента: если файла нет, остаётся градиент */
  $('tiles').innerHTML=t.tiles.map((x,i)=>`<a class="tile" href="#preise" style="background:url(${SITE.images.tiles[i]}) center/cover,${grad[i%5]}"><span><b style="font-weight:500">${x}<em>${SITE.images.tilePrice[i].replace('ab',t.from)}</em></b><i>→</i></span></a>`).join('');
  $('st-eyebrow').textContent=t.stEyebrow;$('st-title').textContent=t.stTitle;$('st-text').textContent=t.stText;
  $('g-eyebrow').textContent=t.gEyebrow; $('g-title').textContent=t.gTitle;
  $('gal').innerHTML=SITE.images.gallery.map(g=>g.endsWith('.mp4')?`<video src="${g}" poster="${g.replace('.mp4','.jpg')}" autoplay muted loop playsinline preload="metadata" aria-label="Beispielvideo"></video>`:`<img src="${g}" alt="Beispielfoto" loading="lazy" onerror="this.outerHTML='<div class=&quot;ph&quot;></div>'">`).join('');
  $('gal').querySelectorAll('video').forEach(v=>{v.muted=true;v.play().catch(()=>{})});
  $('p-eyebrow').textContent=t.pEyebrow; $('p-title').textContent=t.pTitle; $('p-note').textContent=t.pNote; $('offer').innerHTML=t.offer;
  const bookHref=n=>SITE.book||`${wa}?text=${encodeURIComponent(t.askMsg(n))}`;
  $('cats').innerHTML=SITE.price.map(c=>`<div class="cat"><h3>${c[l]}</h3>${c.who?`<div class="who">${c.who}</div>`:'<div class="who">&nbsp;</div>'}${c.items.map(i=>i.sub?`<div class="sub">${i.sub[l]}</div>`:
    `<div class="row"><span class="n">${i[l]}${i['s'+l]?`<small>${i['s'+l]}</small>`:''}</span>${i.d?`<span class="d">${i.d}</span>`:''}<span class="p">${i.p}</span><a class="ask" href="${bookHref(i[l])}" aria-label="${t.ask}: ${i[l]}">${t.ask}</a></div>`).join('')}</div>`).join('');
  $('t-eyebrow').textContent=t.tEyebrow; $('t-title').textContent=t.tTitle; $('t-text').textContent=t.tText;
  $('t-list').innerHTML=t.team.map(([n,s])=>`<li><b>${s}</b><span>${n}</span></li>`).join('');
  $('t-btn').textContent=t.tBtn; $('t-btn').href=main;
  $('portrait').style.background=`url(${SITE.images.portrait}) center/cover,linear-gradient(160deg,#eee8e4,#a99a90)`;
  $('r-eyebrow').textContent=t.rEyebrow; $('r-title').textContent=t.rTitle;
  $('revs').innerHTML=SITE.reviews.map(r=>`<div class="rev"><div class="stars">★★★★★</div><p>„${r.t[l]}“</p><b>${r.a}</b></div>`).join('');
  $('gscore').innerHTML=t.gscore(SITE.google.rating,SITE.google.count);
  $('f-title').textContent=t.fTitle;
  $('faqs').innerHTML=t.faq.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('');
  $('c-eyebrow').textContent=t.cEyebrow; $('c-title').textContent=t.cTitle;
  $('c-addr-h').textContent=t.addrH; $('c-addr').innerHTML=SITE.address; $('c-map').textContent=SITE.map?t.map:''; if(SITE.map)$('c-map').href=SITE.map; else $('c-map').removeAttribute('href');
  $('c-hours-h').textContent=t.hoursH; $('c-hours').innerHTML=SITE.hours.map(([d,h])=>`<div><span>${d}</span><span>${h}</span></div>`).join('');
  $('c-book-h').textContent=t.bookH; $('c-book').textContent=t.book; $('c-btn').textContent=l==='de'?'So eine Website für Ihr Studio ↗':'Такой сайт для вашей студии ↗'; $('c-btn').href=SITE.olha;
  ['ig-h','ig-f','ig-c'].forEach(i=>$(i).href=SITE.instagram);
  $('copy').textContent=t.copy; $('legal').innerHTML=`<a href="${SITE.olha}" target="_blank" rel="noopener">${t.legal}</a>`; $('demo').innerHTML=`<a href="${SITE.olha}" target="_blank" rel="noopener" style="color:inherit">${t.demo}</a>`;
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>render(b.dataset.l));
/* сэндвич-меню для мобильных */
(function(){
  const btn=$('burger'),menu=$('menu');
  const set=o=>{menu.classList.toggle('open',o);btn.setAttribute('aria-expanded',o);btn.setAttribute('aria-label',o?(document.documentElement.lang==='ru'?'Закрыть меню':'Menü schließen'):(document.documentElement.lang==='ru'?'Меню':'Menü'));};
  btn.onclick=e=>{e.stopPropagation();set(!menu.classList.contains('open'));};
  menu.addEventListener('click',e=>{if(e.target.closest('a')) set(false);});
  document.addEventListener('click',e=>{if(!e.target.closest('header')) set(false);});
  document.addEventListener('keydown',e=>{if(e.key==='Escape') set(false);});
  window.addEventListener('resize',()=>{if(innerWidth>900) set(false);});
})();
render('de');
/* лепестки: настоящие лепестки розы из rose.png (img/petals/), 18 на десктопе, 10 на мобильном */
(function(){
  const box=$('petals'),hero=document.querySelector('.hero'); if(!box) return;
  const n=innerWidth<700?10:18, r=(a,b)=>a+Math.random()*(b-a);
  const setFall=()=>box.style.setProperty('--fall',(hero.offsetHeight+80)+'px');
  setFall(); addEventListener('resize',setFall);
  box.innerHTML=Array.from({length:n},(_,k)=>{
    const w=r(18,38),dur=r(11,21),src=`img/petals/petal-${k%8+1}.webp`;
    return `<span class="petal" style="left:${r(-5,100)}%;animation-duration:${dur}s;animation-delay:${-r(0,dur)}s;opacity:${r(.75,1).toFixed(2)}">`+
      `<i style="--sw:${r(20,60)}px;animation-duration:${r(2.5,5)}s"><img src="${src}" alt="" style="width:${w.toFixed(0)}px;animation-duration:${r(3,7)}s"></i></span>`;
  }).join('');
})();

</script>
</body>
</html>

:root{
  /* Copper & Cream */
  --cream:#FBF6F1; --sand:#F3E6DA; --blush:#EBCFBE; --line:#E6D6C8;
  --ink:#2A1C16; --muted:#76625A;
  --copper:#9A3F1C;      /* медь (волосы, средний тон) — кнопки, акценты на светлом */
  --copper-2:#B9562C;    /* hover */
  --glow:#E39466;        /* светлая медь — акценты на тёмном */
  --espresso:#261611; --espresso-2:#3A231A; --on-dark:#F1E4D8; --on-dark-2:#B9A396;
  --teal:#1E3F3D; --teal-2:#2A5250; --teal-soft:#A9C4BE;
  --serif:"Fraunces",Georgia,serif; --sans:Manrope,"Helvetica Neue",Arial,sans-serif;
  --arch:999px 999px 0 0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font:16px/1.7 var(--sans)}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--copper);font-weight:700;display:inline-flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
h2 em,h1 em{font-style:italic;color:var(--copper)}
.bar{background:var(--copper);color:#FBF6F1;text-align:center;font-size:12px;letter-spacing:.08em;padding:9px 16px}
.bar b{font-weight:700}
header{position:sticky;top:0;z-index:10;background:rgba(251,246,241,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:74px;gap:14px}
.logo{display:flex;align-items:center;gap:12px}
.logo .mk{width:40px;height:40px;border-radius:50%;background:var(--copper);color:var(--cream);display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:21px;line-height:1}
.logo b{font-family:var(--serif);font-weight:500;font-size:21px;display:block;line-height:1}
.logo small{display:block;white-space:nowrap;font-size:9px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase;font-weight:600;margin-top:4px}
.menu{display:flex;gap:26px;font-size:13px;font-weight:600}
.menu a{position:relative;padding:4px 0;color:var(--ink)}
.menu a::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1.5px;background:var(--copper);transition:.3s}
.menu a:hover::after{right:0}
.right{display:flex;align-items:center;gap:12px}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{border:0;background:none;padding:5px 11px;border-radius:99px;cursor:pointer;color:var(--muted);font:600 11px var(--sans);letter-spacing:.1em}
.lang button.on{background:var(--ink);color:var(--cream)}
.burger{display:none;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:none;cursor:pointer;font-size:17px}
@media(max-width:960px){
  .burger{display:block}

  .menu.open{display:flex}
  .menu a{padding:13px 0;border-bottom:1px solid var(--line)}
}
/* buttons */

.on-dark .btn{background:var(--glow);border-color:var(--glow);color:var(--espresso)}
.on-dark .btn:hover{background:transparent;color:var(--glow)}
.ph{background-color:var(--blush);background-size:cover;background-position:center}

.hero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(154,63,28,.10),rgba(38,22,17,.18));mix-blend-mode:multiply;z-index:1;pointer-events:none}

.hero h1 em{display:block;font-weight:400}
.hero p.tag{font-size:clamp(18px,1.8vw,21px);color:#4E3B32;max-width:470px;margin-bottom:34px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .meta{display:flex;gap:30px;flex-wrap:wrap;margin-top:46px;padding-top:24px;border-top:1px solid var(--line);max-width:520px}

.hero .meta span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero .badge{position:absolute;right:max(22px,calc((100vw - 1200px)/2 + 22px));bottom:48px;z-index:3;width:122px;height:122px;border-radius:50%;background:var(--espresso);color:var(--on-dark);display:grid;place-items:center;text-align:center;font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;line-height:1.4;box-shadow:0 14px 34px rgba(38,22,17,.35)}
.hero .badge b{display:block;font-family:var(--serif);font-size:34px;letter-spacing:0;color:var(--glow);font-weight:400;text-transform:none}
@media(max-width:900px){

  .hero .grid{min-height:0;padding:0 22px 56px;margin-top:-40px}
  .hero .badge{top:calc(62vh - 150px);bottom:auto;right:18px;width:100px;height:100px}
}

.head.c{flex-direction:column;align-items:center;text-align:center}

@media(max-width:800px){.val{border-left:0;padding:0}}
.val .num{font-family:var(--serif);font-style:italic;font-size:40px;line-height:1;color:var(--glow)}
.val h3{font-size:22px;margin-bottom:6px;color:#FBF6F1}
.val p{color:var(--on-dark-2);font-size:14px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}

@media(max-width:520px){.tiles{grid-template-columns:1fr}}
.tile{display:block;group:1}
.tile .img{aspect-ratio:3/4;border-radius:var(--arch);overflow:hidden;position:relative}
.tile .img div{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.tile:hover .img div{transform:scale(1.06)}

.cat{border:1px solid rgba(227,148,102,.22);border-radius:22px;padding:34px 32px 26px;background:var(--espresso-2)}

.cat.wide{grid-column:1/-1;background:transparent}

    <div class="grp">${t.grp[0]}</div>${row(t.rows[2],L.p[2])}${row(t.rows[3],L.p[3])}${row(t.rows[4],L.p[4])}
    ${row(t.rows[5],L.p[5])}
    <div class="grp">${t.grp[1]}</div>${row(t.rows[6],L.p[6])}${row(t.rows[7],L.p[7])}</div>`).join('')
    +`<div class="cat wide"><div class="grp" style="margin-top:0">${t.grp[2]}</div><div class="extras">${t.extras.map((n,i)=>row(n,SITE.extras[i])).join('')}</div></div>`;
  $('g-eyebrow').textContent=t.gEyebrow; $('g-title').innerHTML=em(t.gTitle); $('g-btn').href=SITE.instagram;
  $('gal').innerHTML=SITE.images.gallery.map((g,i)=>`<div class="ph" role="img" aria-label="Beispielfoto Maniküre" style="${bg(g,i)}"></div>`).join('');
  $('st-eyebrow').textContent=t.stEyebrow; $('st-title').innerHTML=em(t.stTitle); $('st-text').textContent=t.stText;
  if(!$('st-photo').getAttribute('src')){$('st-video').poster=SITE.images.studioPoster;if(SITE.images.studioVideo)$('st-video').src=SITE.images.studioVideo;$('st-photo').src=SITE.images.studioPhoto;}
  $('t-eyebrow').textContent=t.tEyebrow; $('t-title').innerHTML=em(t.tTitle); $('t-text').textContent=t.tText;
  $('t-facts').innerHTML=t.facts.map(([b,s])=>`<div><b>${b}</b><span>${s}</span></div>`).join('');
  $('t-btn').textContent=t.tBtn; $('t-btn').href=book;
  $('masters').innerHTML=t.masters.map(([n,r])=>`<div class="master"><span class="av">${n[0]}</span><div><span>${r}</span><b>${n}</b></div></div>`).join('');
  $('k-eyebrow').textContent=t.kEyebrow; $('k-title').innerHTML=em(t.kTitle); $('k-lead').textContent=t.kLead;
  $('days').innerHTML=t.days.map(([k,h,p])=>`<div class="day"><div class="k">${k}</div><h3>${h}</h3><p>${p}</p></div>`).join('');
  $('k-bonus').innerHTML=t.kBonus; $('k-btn').textContent=t.kBtn; $('k-btn').href=book;
  $('f-title').innerHTML=em(t.fTitle);
  $('faqs').innerHTML=t.faq.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('');
  $('c-eyebrow').textContent=t.cEyebrow; $('c-title').innerHTML=em(t.cTitle);
  $('c-addr-h').textContent=t.addrH; $('c-addr').innerHTML=SITE.address; $('c-map').textContent=SITE.map?t.map:''; if(SITE.map)$('c-map').href=SITE.map; else $('c-map').removeAttribute('href');
  $('c-hours-h').textContent=t.hoursH; $('c-hours').textContent=t.hours;
  $('c-book-h').textContent=t.bookH; $('c-book').textContent=t.book; $('c-btn').textContent=l==='de'?'So eine Website für Ihr Studio ↗':'Такий сайт для вашої студії ↗'; $('c-btn').href=SITE.olha;
  $('copy').textContent=t.copy; $('legal').innerHTML=`<a href="${SITE.olha}" target="_blank" rel="noopener" style="color:inherit">${t.legal}</a>`; $('demo').innerHTML=`<a href="${SITE.olha}" target="_blank" rel="noopener" style="color:inherit">${t.demo}</a>`;
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>render(b.dataset.l));
$('burger').onclick=()=>$('menu').classList.toggle('open');
$('menu').onclick=()=>$('menu').classList.remove('open');
render('de');
</script>

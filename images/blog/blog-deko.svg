<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1400" width="600" height="1400" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="arch"><path d="M0 300 A300 300 0 0 1 600 300 V1400 H0 Z"/></clipPath>

<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Website selbst gestalten · Olha Polishchuk</title>

<!--
  ПРОТОТИП v1 конструктора «Website selbst» (20.11.2026). Бриф: Uslugi/plan/ideya-konstruktor-sajta.md
  Слева форма, справа предпросмотр vorschau.html (шаблон MIDNA). Черновик — localStorage (без фото).
  Заявка → Cloudflare Worker kontakt (ветка kind:"website-selbst") → Brevo → Gmail, полные данные во вложении JSON.
  Пока тест: noindex, не в sitemap, ссылок с сайта нет.
  ЦЕНЫ ниже (PREIS) — заглушка, решить и вписать.
-->
<link rel="icon" href="/images/logo-navy-96.webp">
<style>
@font-face{font-family:'Manrope';font-style:normal;font-weight:400;font-display:swap;src:url(../demo/midna/fonts/manrope-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:'Manrope';font-style:normal;font-weight:400;font-display:swap;src:url(../demo/midna/fonts/manrope-cyrillic-400-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';font-style:normal;font-weight:600;font-display:swap;src:url(../demo/midna/fonts/manrope-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:'Manrope';font-style:normal;font-weight:600;font-display:swap;src:url(../demo/midna/fonts/manrope-cyrillic-600-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';font-style:normal;font-weight:700;font-display:swap;src:url(../demo/midna/fonts/manrope-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:'Manrope';font-style:normal;font-weight:700;font-display:swap;src:url(../demo/midna/fonts/manrope-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
:root{--ink:#1E2A4A;--ink-soft:#4A5568;--amber:#D48B3A;--amber-d:#A9651E;--amber-pale:#FDF3E7;--bg:#fff;--bg-soft:#F7F6F4;--bg-mid:#EEF0F5;--line:rgba(30,42,74,.13);--err:#B42318;--ok:#1F7A4D;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.55 Manrope,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg-soft)}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(380px,460px) 1fr;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}
.side,.prev{min-height:0}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--ink);color:#fff;flex-wrap:wrap}
.top .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:14px;margin-right:auto}
.top .brand span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--ink);font-weight:700;font-size:13px}
.top .brand small{font-weight:400;opacity:.7;margin-left:6px}
.top .brand em{font-style:normal;border-bottom:1px solid rgba(255,255,255,.45);padding-bottom:1px}
.top .brand:hover em{border-color:#fff}
.seg{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:2px}
.seg button{border:0;background:none;color:#fff;padding:4px 11px;border-radius:99px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.75}
.seg button.on{background:#fff;color:var(--ink);opacity:1}
.tbtn{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
.tbtn:hover{background:rgba(255,255,255,.12)}
.tbtn.warn{border-color:#F5B3AB;color:#FFD7D2}
.status{font-size:12px;opacity:.75;min-width:120px;text-align:right}
/* form */
.side{position:relative;overflow:auto;background:var(--bg);border-right:1px solid var(--line);padding:22px 24px 120px}
.intro h1{font-size:23px;line-height:1.25;margin-bottom:8px}
.intro p{color:var(--ink-soft);font-size:14px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 6px;counter-reset:s}
.steps div{background:var(--bg-soft);border-radius:var(--r);padding:10px;font-size:12px;line-height:1.35;color:var(--ink-soft)}
.steps div::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--amber);color:#fff;font-weight:700;font-size:12px;margin-bottom:6px}
.price{margin:12px 0 4px;background:var(--amber-pale);border:1px solid #F1D8B8;border-radius:var(--r);padding:10px 12px;font-size:13px}
.price b{font-size:15px}
.incl{margin-top:10px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:13px}
.incl>b{display:block;font-size:13.5px;margin-bottom:6px}
.incl ul{list-style:none;display:grid;gap:6px}
.incl li{position:relative;padding-left:20px;color:var(--ink-soft);line-height:1.45}
.incl li::before{content:"✓";position:absolute;left:2px;top:0;color:var(--amber-d);font-weight:700}
.incl li b{color:var(--ink);font-weight:600}
.price s{color:var(--ink-soft);margin-right:4px}
.price .fix{display:block;margin-top:6px;padding-top:6px;border-top:1px dashed #E9C99F}
.price .seats{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:700;font-size:12.5px;color:var(--amber-d)}
.price .dots{display:flex;gap:4px}.price .dots i{width:10px;height:10px;border-radius:50%;background:var(--amber)}.price .dots i.off{background:#E9D6BF}
.neu{display:inline-block;background:var(--amber);color:#fff;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:2px 9px;margin:0 6px 4px 0;vertical-align:1px}
fieldset{border:0;border-top:1px solid var(--line);padding:22px 0 6px;margin-top:22px}
legend{font-weight:700;font-size:16px;padding-right:10px;display:flex;align-items:center;gap:8px}
legend i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px}
.hint{font-size:12.5px;color:var(--ink-soft);margin:4px 0 12px}
.hint.warn{background:var(--amber-pale);border-left:3px solid var(--amber);padding:8px 10px;border-radius:0 6px 6px 0}
label.f{display:block;margin:12px 0 0;font-weight:600;font-size:13px}
label.f .req{color:var(--err)}
label.f small{font-weight:400;color:var(--ink-soft)}
input[type=text],input[type=email],input[type=tel],textarea,select{width:100%;margin-top:5px;padding:10px 12px;border:1px solid rgba(30,42,74,.22);border-radius:8px;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus,select:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(30,42,74,.12)}
.bad input,.bad textarea,input.bad{border-color:var(--err);box-shadow:0 0 0 3px rgba(180,35,24,.1)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:110px 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:13.5px;cursor:pointer}
.chk input{margin-top:3px;width:17px;height:17px;flex:none;accent-color:var(--ink)}
.chk.bad span{color:var(--err)}
.count{float:right;font-weight:400;font-size:11.5px;color:var(--ink-soft)}
.sug{display:flex;align-items:flex-start;gap:8px;width:100%;margin-top:6px;border:1px dashed #E1B77F;background:var(--amber-pale);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.4;text-align:left;cursor:pointer}
.sug:hover{border-style:solid}
.sug b{white-space:nowrap;color:var(--amber-d)}
.sug span{color:var(--ink-soft);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sug[hidden]{display:none}
/* schemes */
.schemes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.schemes label{cursor:pointer;border:2px solid transparent;border-radius:12px;padding:6px;text-align:center;font-size:11.5px;font-weight:600;background:var(--bg-soft)}
.schemes label:has(input:checked){border-color:var(--ink);background:#fff}
.schemes input{position:absolute;opacity:0;pointer-events:none}
.schemes .sw{display:flex;height:34px;border-radius:8px;overflow:hidden;margin-bottom:5px}
.schemes .sw i{flex:1}
/* services */
.svc{display:grid;grid-template-columns:1fr 92px 34px;gap:8px;align-items:start;background:var(--bg-soft);border-radius:var(--r);padding:10px;margin-top:10px}
.svc input{margin-top:0}
.svc .d{grid-column:1/3}
.svc .x{width:34px;height:40px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:16px;color:var(--ink-soft)}
.svc .x:hover{color:var(--err);border-color:var(--err)}
.svc .ph{grid-column:3;width:34px;height:40px;border:1px dashed rgba(30,42,74,.35);border-radius:8px;background:#fff center/cover no-repeat;display:grid;place-items:center;cursor:pointer;font-size:15px;position:relative}
.svc .ph.has{border-style:solid;font-size:0}
.svc .ph input{position:absolute;width:1px;height:1px;opacity:0}
.svc .d.full{grid-column:1/-1}
.add{margin-top:10px;border:1.5px dashed rgba(30,42,74,.3);background:none;border-radius:var(--r);padding:10px;width:100%;cursor:pointer;font-weight:600}
.add:hover{border-color:var(--ink);background:var(--bg-soft)}
/* uploads */
.up{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.up .pv{width:52px;height:52px;border-radius:8px;background:var(--bg-mid) center/cover no-repeat;flex:none;border:1px solid var(--line)}
.up label.b{border:1px solid rgba(30,42,74,.25);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600}
.up label.b:hover{border-color:var(--ink)}
.up input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.up .rm{border:0;background:none;color:var(--err);cursor:pointer;font-size:13px;text-decoration:underline}
.gal4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.gal4 label{aspect-ratio:3/4;border-radius:8px;border:1.5px dashed rgba(30,42,74,.3);background:var(--bg-soft) center/cover no-repeat;display:grid;place-items:center;cursor:pointer;font-size:22px;color:var(--ink-soft);position:relative}
.gal4 label.has{border-style:solid;color:transparent}
.gal4 input{position:absolute;width:1px;height:1px;opacity:0}
/* submit */
.terms{margin-top:12px;font-size:13px;background:var(--bg-soft);border-radius:var(--r);padding:10px 12px}
.terms summary{cursor:pointer;font-weight:600}
.terms ul{margin:8px 0 2px 18px;color:var(--ink-soft)}
.terms li{margin:4px 0}
.send{margin-top:18px;width:100%;border:0;background:var(--amber);color:#fff;font-weight:700;font-size:15px;padding:15px;border-radius:99px;cursor:pointer;transition:.2s}
.send:hover{background:var(--amber-d)}
.send:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;border-radius:var(--r);padding:12px 14px;font-size:14px;display:none}
.msg.err{display:block;background:#FDECEA;color:var(--err)}
.msg.ok{display:block;background:#E8F5EE;color:var(--ok)}
.msg ul{margin:6px 0 0 18px}
.msg a{font-weight:700}
.small{font-size:12px;color:var(--ink-soft);margin-top:10px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
pre.test{white-space:pre-wrap;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px;max-height:260px;overflow:auto;color:var(--ink)}
/* preview */
.prev{display:flex;flex-direction:column;min-width:0;min-height:0}
.ptools{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--bg-mid);font-size:12.5px;flex-wrap:wrap}
.ptools .seg{border-color:rgba(30,42,74,.25)}
.ptools .seg button{color:var(--ink)}
.ptools .seg button.on{background:var(--ink);color:#fff}
.ptools .lk{display:flex;gap:12px}
.ptools .lk button{border:0;background:none;cursor:pointer;text-decoration:underline;color:var(--ink-soft);font-size:12.5px}
.stage{flex:1;overflow:auto;display:flex;justify-content:center;background:#DDE1EA;padding:0}
.stage.mob{padding:20px 0}
.frame{width:100%;height:100%;border:0;background:#fff;display:block}
.stage.mob .frame{width:390px;height:780px;max-height:calc(100% - 0px);border-radius:28px;box-shadow:0 0 0 10px #1E2A4A,0 20px 50px rgba(0,0,0,.3)}
.tabs{display:none}
@media(max-width:980px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh;overflow:visible}
  .side{border-right:0;padding-bottom:110px}
  .prev{position:fixed;inset:0 0 64px 0;z-index:30;background:var(--bg-mid);display:none}
  body.show-prev .prev{display:flex}
  body.show-prev .side{display:none}
  .ptools .seg.dev{display:none}
  .stage.mob{padding:0}.stage.mob .frame{width:100%;height:100%;border-radius:0;box-shadow:none}
  .tabs{display:flex;justify-content:center;position:fixed;left:0;right:0;bottom:0;height:64px;align-items:center;z-index:40;background:var(--ink);gap:6px;padding:0 12px;box-shadow:0 -6px 20px rgba(0,0,0,.15)}
  .tabs button{flex:1;max-width:200px;border:0;background:none;color:#fff;padding:10px 20px;border-radius:99px;font-weight:700;cursor:pointer;font-size:14px}
  .tabs button.on{background:#fff;color:var(--ink)}
  .status{display:none}
}
@media(max-width:480px){.row2{grid-template-columns:1fr}.schemes{grid-template-columns:repeat(2,1fr)}.top .brand small{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a class="brand" href="/" id="back"><span>op</span><em data-t="back"></em><small data-t="backSub"></small></a>
    <div class="seg" id="ui-lang"><button data-l="de">DE</button><button data-l="uk">UA</button><button data-l="ru">RU</button></div>
    <span class="status" id="status"></span>
    <button class="tbtn" id="save" type="button" data-t="save"></button>
    <button class="tbtn warn" id="reset" type="button" data-t="reset"></button>
  </div>

  <form class="side" id="f" novalidate autocomplete="on">
    <div class="intro">
      <h1 data-t="h1"></h1>
      <p data-t="lead"></p>
      <div class="steps"><div data-t="st1"></div><div data-t="st2"></div><div data-t="st3"></div></div>
      <div class="price" id="price"></div>
      <div class="incl"><b data-t="inclT"></b><ul id="incl"></ul></div>
    </div>

    <fieldset id="fs-studio"><legend><i>1</i><span data-t="l1"></span></legend>
      <label class="f"><span data-t="studio"></span> <span class="req">*</span><input type="text" name="studio" maxlength="40" data-ph="studioPh" required></label>
      <div class="row2">
        <label class="f"><span data-t="category"></span><input type="text" name="category" maxlength="30" list="cats" data-ph="categoryPh"></label>
        <label class="f"><span data-t="siteLang"></span><select name="siteLang"><option value="de">Deutsch</option><option value="uk">Українська</option><option value="ru">Русский</option></select></label>
      </div>
      <button type="button" class="sug" data-sug="category"></button>
      <datalist id="cats"><option value="Nagelstudio"><option value="Kosmetikstudio"><option value="Lash & Brows"><option value="Permanent Make-up"><option value="Beauty-Studio"><option value="Massage"></datalist>
      <label class="f"><span data-t="slogan"></span> <span class="count" data-c="slogan"></span><input type="text" name="slogan" maxlength="90" data-ph="sloganPh"></label><button type="button" class="sug" data-sug="slogan"></button>
      <p class="hint warn" data-t="hwg"></p>
      <label class="f" data-t="scheme"></label>
      <div class="schemes" id="schemes"></div>
      <label class="f" data-t="logo"></label>
      <div class="up" data-img="logo"><span class="pv"></span><label class="b"><input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><span data-t="pick"></span></label><button type="button" class="rm" data-t="remove" hidden></button></div>
    </fieldset>

    <fieldset id="fs-contact"><legend><i>2</i><span data-t="l2"></span></legend>
      <label class="f"><span data-t="street"></span><input type="text" name="street" maxlength="80" autocomplete="street-address" data-ph="streetPh"></label>
      <div class="row3">
        <label class="f"><span data-t="zip"></span><input type="text" name="zip" maxlength="5" inputmode="numeric" autocomplete="postal-code"></label>
        <label class="f"><span data-t="city"></span><input type="text" name="city" maxlength="40" autocomplete="address-level2"></label>
      </div>
      <label class="f"><span data-t="hours"></span><textarea name="hours" rows="3" maxlength="300" data-ph="hoursPh"></textarea></label><button type="button" class="sug" data-sug="hours"></button>
      <label class="f"><span data-t="phone"></span> <span class="req">*</span><input type="tel" name="phone" maxlength="30" autocomplete="tel" data-ph="phonePh" required></label>
      <label class="chk"><input type="checkbox" name="whatsapp" checked><span data-t="wa"></span></label>
      <label class="f"><span data-t="instagram"></span><input type="text" name="instagram" maxlength="60" data-ph="instagramPh"></label>
      <label class="f"><span data-t="ctaTitle"></span><input type="text" name="ctaTitle" maxlength="70" data-ph="ctaPh"></label><button type="button" class="sug" data-sug="ctaTitle"></button>
    </fieldset>

    <fieldset id="fs-svc"><legend><i>3</i><span data-t="l3"></span></legend>
      <p class="hint" data-t="svcHint"></p>
      <div id="svcs"></div>
      <button type="button" class="add" id="add" data-t="add"></button>
    </fieldset>

    <fieldset id="fs-about"><legend><i>4</i><span data-t="l4"></span></legend>
      <label class="f"><span data-t="owner"></span><input type="text" name="owner" maxlength="40" autocomplete="name"></label>
      <label class="f"><span data-t="about"></span> <span class="count" data-c="about"></span><textarea name="about" rows="6" maxlength="700" data-ph="aboutPh"></textarea></label><button type="button" class="sug" data-sug="about"></button>
      <label class="f" data-t="portrait"></label>
      <div class="up" data-img="portrait"><span class="pv"></span><label class="b"><input type="file" accept="image/png,image/jpeg,image/webp"><span data-t="pick"></span></label><button type="button" class="rm" data-t="remove" hidden></button></div>
    </fieldset>

    <fieldset id="fs-photos"><legend><i>5</i><span data-t="l5"></span></legend>
      <p class="hint" data-t="photoHint"></p>
      <label class="f" data-t="hero"></label>
      <div class="up" data-img="hero"><span class="pv"></span><label class="b"><input type="file" accept="image/png,image/jpeg,image/webp"><span data-t="pick"></span></label><button type="button" class="rm" data-t="remove" hidden></button></div>
      <label class="f" data-t="gallery"></label>
      <div class="gal4" id="gal4"></div>
    </fieldset>

    <fieldset id="fs-imp"><legend><i>6</i><span data-t="l6"></span></legend>
      <p class="hint" data-t="impHint"></p>
      <label class="f"><span data-t="impName"></span> <span class="req">*</span><input type="text" name="imp.name" maxlength="80" autocomplete="name" required></label>
      <label class="f"><span data-t="impCompany"></span><input type="text" name="imp.company" maxlength="80" autocomplete="organization"></label>
      <label class="chk"><input type="checkbox" name="imp.same" checked><span data-t="impSame"></span></label>
      <div id="imp-addr" hidden>
        <label class="f"><span data-t="street"></span> <span class="req">*</span><input type="text" name="imp.street" maxlength="80"></label>
        <div class="row3">
          <label class="f"><span data-t="zip"></span> <span class="req">*</span><input type="text" name="imp.zip" maxlength="5" inputmode="numeric"></label>
          <label class="f"><span data-t="city"></span> <span class="req">*</span><input type="text" name="imp.city" maxlength="40"></label>
        </div>
      </div>

function shrink(file,max,keepPng){return new Promise((res,rej)=>{
  if(!/^image\//.test(file.type))return rej();
  if(file.type==="image/svg+xml"){const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);return}
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(keepPng?c.toDataURL("image/png"):c.toDataURL("image/jpeg",.85))};
  im.onerror=()=>{URL.revokeObjectURL(url);rej()};im.src=url})}

const EMAIL_RE=/^[^\s@<>"]+@[^\s@<>"]+\.[^\s@<>"]{2,}$/;
const DOMAIN_RE=/^(?=.{3,63}$)[a-z0-9äöüß]([a-z0-9äöüß-]*[a-z0-9äöüß])?\.[a-z]{2,}$/i;
function validate(){
  const u=U[ui],miss=[],mark=[];
  const need=(name,label)=>{const el=F.elements[name];if(!String(el.value).trim()){miss.push(label);mark.push(el)}};
  need("studio",u.studio);need("phone",u.phone);
  if(!data.services.some(s=>s.name.trim()&&s.price.trim())){miss.push(u.needSvc);mark.push($("#svcs input"))}
  need("imp.name",u.impName);
  if(!data.imp.same){need("imp.street",u.street);need("imp.zip",u.zip);need("imp.city",u.city)}
  else{if(!data.street.trim()){miss.push(u.street);mark.push(F.elements.street)}if(!data.zip.trim()){miss.push(u.zip);mark.push(F.elements.zip)}if(!data.city.trim()){miss.push(u.city);mark.push(F.elements.city)}}
  if(!data.imp.phone.trim()&&!data.phone.trim()){miss.push(u.impPhone);mark.push(F.elements["imp.phone"])}
  if(!EMAIL_RE.test(data.imp.email.trim())){miss.push(u.badMail);mark.push(F.elements["imp.email"])}
  if(data.domain.trim()&&!DOMAIN_RE.test(data.domain.trim().replace(/^https?:\/\//,"").replace(/^www\./,""))){miss.push(u.badDomain);mark.push(F.elements.domain)}
  ["photos","content","terms"].forEach(k=>{if(!data.ok[k]){const el=F.elements["ok."+k];miss.push(el.nextElementSibling.textContent);mark.push(el.closest(".chk"))}});
  mark.forEach(el=>el&&(el.classList.contains("chk")?el.classList.add("bad"):el.classList.add("bad")));
  return{miss,first:mark[0]};
}

}
